<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NK-Links</title>
    <link rel="icon" href="https://raw.githubusercontent.com/Phoenix0180/Links/refs/heads/main/Myself.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- ⚡ 1. Busuanzi Script -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: row;
            align-items: center;
            max-width: 800px;
            position: relative; 
        }
        .image-container {
            flex: 1;
            margin-right: 20px;
            text-align: center;
        }
        .content-container {
            flex: 2;
            text-align: left;
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        .links {
            margin-top: 20px;
        }
        .links a {
            display: block;
            margin: 10px 0;
            text-decoration: none;
            color: #007BFF;
            font-size: 18px;
            transition: transform 0.3s ease;
        }
        .links a:hover {
            text-decoration: underline;
            transform: translateY(-5px); 
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            max-height: 300px; 
        }
        .links a i {
            margin-right: 10px;
            font-size: 20px;
            color: #007BFF;
        }
        .description {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
        .aquila-logo {
            width: 20px; 
            height: auto;
            vertical-align: middle;
            margin-right: 10px;
        }
        .card-footer {
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 14px;
            color: #666;
        }

        /* ⚡ 2. New Style for Screen Bottom Stats */
        .screen-bottom-stats {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #888;
        }
        .screen-bottom-stats span {
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-container">
            <img src="https://raw.githubusercontent.com/Phoenix0180/Links/refs/heads/main/Myself.jpg" alt="Description of the image">
        </div>
        <div class="content-container">
            <h1>Welcome to the Portal</h1>
            <div class="links">
                <a href="https://github.com/Phoenix0180" target="_blank"><i class="fab fa-github"></i> GitHub</a>
                <a href="https://www.instagram.com/nakul3" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
                <a href="https://www.facebook.com/nakul.k.victory" target="_blank"><i class="fab fa-facebook"></i> Facebook</a>
                <a href="https://www.instagram.com/sketches.aquila" target="_blank"><i class="fab fa-instagram"></i> Art Page</a>
                <a href="https://www.instagram.com/thrill.ride3" target="_blank"><i class="fab fa-instagram"></i> Moto Rides</a>
                <a href="https://aquilal.web.app/" target="_blank"><img src="https://aquilal.web.app/images/favicon.svg" alt="AquilaLab Logo" class="aquila-logo"> Aquila Lab</a>            
                <a href="https://typoai.web.app/" target="_blank"><img src="https://aquilal.web.app/images/favicon.svg" alt="AquilaLab Logo" class="aquila-logo"> TYPOai</a>
                <a href="https://exammockai.web.app/" target="_blank"><img src="https://exammockai.web.app/static/img/favicon.svg" alt="AquilaLab Logo" class="aquila-logo"> ExamMockAI</a>
            </div>
        </div>
        <div class="card-footer">
            Powered by AquilaLab
        </div>
    </div>

    <!-- ⚡ 3. Visitor Count at Bottom of Screen -->
    <div class="screen-bottom-stats">
        <span id="busuanzi_container_site_uv" style="display:none;">
            Visitors: <b id="busuanzi_value_site_uv">...</b>
        </span>
        <span id="busuanzi_container_site_pv" style="display:none; border-left: 1px solid #ccc; padding-left: 10px;">
            Views: <b id="busuanzi_value_site_pv">...</b>
        </span>
    </div>

</body>
</html>
